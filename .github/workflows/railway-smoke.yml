name: railway-smoke

on:
  push:
    branches:
      - feat/pi-chat-rca

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Railway image
        run: docker build -t pi-chat-railway .
      - name: Run container
        run: |
          docker run -d --name pi-chat-demo -e PORT=3000 -p 3000:3000 pi-chat-railway
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs pi-chat-demo
          exit 1
      - name: RCA API smoke
        run: |
          CREATE=$(curl -fsS -X POST http://127.0.0.1:3000/api/conversation)
          echo "$CREATE" > /tmp/create.json
          CID=$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/create.json","utf8"));console.log(j.conversation?.id ?? j.id ?? j.conversationId)')
          curl -fsS -X POST -F 'text=/rca t039' -F 'skills=[]'             "http://127.0.0.1:3000/api/conversation/$CID/messages"
          for i in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:3000/api/conversation/$CID" > /tmp/snapshot.json
            if node -e '
              const fs=require("fs");
              const s=JSON.parse(fs.readFileSync("/tmp/snapshot.json","utf8"));
              const ok=(s.messageList??[]).some(x=>x.kind==="message" && x.message?.role==="assistant" && String(x.message?.text||"").includes("RCA 调查结论"));
              process.exit(ok?0:1)
            '; then
              exit 0
            fi
            sleep 2
          done
          docker logs pi-chat-demo
          cat /tmp/snapshot.json
          exit 1
      - name: Logs
        if: always()
        run: docker logs pi-chat-demo || true
