name: rca-live-snapshot

on:
  push:
    branches:
      - feat/pi-chat-rca

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser and CJK fonts
        run: |
          pnpm dlx playwright@1.55.0 install chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk git-lfs

      - name: Download RCA100 t039 agent-facing telemetry only
        run: |
          cd apps/pi-chat
          pnpm rca:fetch:t039

      - name: Run current Pi Chat, execute t039, and capture real RCA UI
        env:
          PI_CHAT_ROOT_DIR: /tmp/pi-chat-state
          RCA100_CASES_DIR: ${{ github.workspace }}/apps/pi-chat/.rca-data/cases
          RCA_INVESTIGATIONS_DIR: /tmp/pi-chat-state/data/rca/investigations
          RCA_DEFAULT_CASE_ID: t039
          RCA_AGENTIC_PLANNER: "false"
        run: |
          set -euo pipefail
          (
            cd apps/pi-chat
            pnpm exec tsx --tsconfig tsconfig.node.json server/index.ts > /tmp/pi-chat-api.log 2>&1 &
            API_PID=$!
            pnpm exec vite --host 127.0.0.1 > /tmp/pi-chat-web.log 2>&1 &
            WEB_PID=$!

            cleanup() {
              kill $API_PID $WEB_PID 2>/dev/null || true
            }
            trap cleanup EXIT

            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:4328/api/system/bootstrap >/dev/null 2>&1 &&                  curl -fsS http://127.0.0.1:5173 >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            echo "=== API startup ==="
            tail -80 /tmp/pi-chat-api.log || true
            echo "=== WEB startup ==="
            tail -40 /tmp/pi-chat-web.log || true

            CREATE_JSON=$(curl -fsS -X POST http://127.0.0.1:4328/api/conversation)
            echo "$CREATE_JSON" > /tmp/create.json
            CID=$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/create.json","utf8")); console.log(j.conversation?.id ?? j.id ?? j.conversationId)')
            echo "Conversation: $CID"

            curl -fsS -X POST               -F 'text=/rca t039'               -F 'skills=[]'               "http://127.0.0.1:4328/api/conversation/$CID/messages"               | tee /tmp/rca-start.json

            COMPLETE=0
            for i in $(seq 1 120); do
              curl -fsS "http://127.0.0.1:4328/api/conversation/$CID" > /tmp/snapshot.json
              if node -e '
                const fs=require("fs");
                const s=JSON.parse(fs.readFileSync("/tmp/snapshot.json","utf8"));
                const items=s.messageList ?? [];
                const ok=items.some(x=>x.kind==="message" && x.message?.role==="assistant" && String(x.message?.text||"").includes("RCA 调查结论"));
                process.exit(ok?0:1);
              '; then
                COMPLETE=1
                break
              fi
              sleep 2
            done

            echo "=== RCA complete? $COMPLETE ==="
            cat /tmp/snapshot.json
            echo
            echo "=== API tail ==="
            tail -200 /tmp/pi-chat-api.log || true

            if [ "$COMPLETE" != "1" ]; then
              echo "RCA did not complete" >&2
              exit 1
            fi

            pnpm dlx playwright@1.55.0 screenshot               --viewport-size="1440,1000"               --full-page               --wait-for-timeout=3000               "http://127.0.0.1:5173/conversation/$CID"               ../../t039-live-rca.png

            cp /tmp/snapshot.json ../../t039-conversation-snapshot.json
            mkdir -p ../../t039-investigation-artifacts
            cp -a /tmp/pi-chat-state/data/rca/investigations/. ../../t039-investigation-artifacts/
          )

      - uses: actions/upload-artifact@v4
        with:
          name: t039-live-rca
          path: |
            t039-live-rca.png
            t039-conversation-snapshot.json
            t039-investigation-artifacts/
