name: pi-chat-ci

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "apps/pi-chat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pi-chat-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter pi-chat typecheck
      - name: Lint
        run: pnpm --filter pi-chat lint
      - name: Unit tests
        run: pnpm --filter pi-chat test
      - name: Build
        run: pnpm --filter pi-chat build
