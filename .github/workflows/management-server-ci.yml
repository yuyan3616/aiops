name: Management Server CI

on:
  pull_request:
    paths:
      - "apps/management-server/**"
      - "docs/spring-management-server-spec.md"
      - "docs/spring-management-task-execution-spec.md"
      - "docs/runtime-execution-api-spec.md"
      - ".github/workflows/management-server-ci.yml"
  push:
    branches:
      - main
      - feat/spring-management-server
    paths:
      - "apps/management-server/**"
      - "docs/spring-management-server-spec.md"
      - "docs/spring-management-task-execution-spec.md"
      - "docs/runtime-execution-api-spec.md"
      - ".github/workflows/management-server-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: management
          MYSQL_USER: management
          MYSQL_PASSWORD: management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -umanagement -pmanagement"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MANAGEMENT_DB_HOST: 127.0.0.1
      MANAGEMENT_DB_PORT: 3306
      MANAGEMENT_DB_NAME: management
      MANAGEMENT_DB_USERNAME: management
      MANAGEMENT_DB_PASSWORD: management
    defaults:
      run:
        working-directory: apps/management-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/management-server/pom.xml

      - name: Test
        run: mvn --batch-mode --no-transfer-progress test
